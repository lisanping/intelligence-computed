<?xml version="1.0" encoding="UTF-8"?>
<!--
  计算即智能 · 导航栏 logo
  与 favicon 同一 mark，外层不画芯片底座，让 logo 在亮/暗 nav 上自适应
  中心核保留发光感，节点轻微脉冲动画（仅在悬停时启动）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="计算即智能 logo">
  <defs>
    <radialGradient id="lg-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lg-core" cx="35%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#BAE6FD"/>
      <stop offset="80%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
  </defs>

  <!-- halo 在亮色 / 暗色背景都不会形成边缘 -->
  <circle cx="32" cy="32" r="22" fill="url(#lg-halo)"/>

  <!-- 六幕辐条 -->
  <g stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="32" x2="32"    y2="12" stroke="#B23A48"/>
    <line x1="32" y1="32" x2="49.32" y2="22" stroke="#2C5F7C"/>
    <line x1="32" y1="32" x2="49.32" y2="42" stroke="#C9A227"/>
    <line x1="32" y1="32" x2="32"    y2="52" stroke="#355C3A"/>
    <line x1="32" y1="32" x2="14.68" y2="42" stroke="#6B4E8E"/>
    <line x1="32" y1="32" x2="14.68" y2="22" stroke="#B7BCC7"/>
  </g>

  <!-- 六幕节点 -->
  <g>
    <circle cx="32"    cy="12" r="3.4" fill="#B23A48"/>
    <circle cx="49.32" cy="22" r="3.4" fill="#2C5F7C"/>
    <circle cx="49.32" cy="42" r="3.4" fill="#C9A227"/>
    <circle cx="32"    cy="52" r="3.4" fill="#355C3A"/>
    <circle cx="14.68" cy="42" r="3.4" fill="#6B4E8E"/>
    <circle cx="14.68" cy="22" r="3.4" fill="#B7BCC7"/>
  </g>

  <!-- 中心智能核 -->
  <circle cx="32" cy="32" r="7.2" fill="url(#lg-core)"/>
  <circle cx="32" cy="32" r="7.2" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.7"/>
</svg>
